<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent !important;
    overflow: hidden;
    user-select: none;
    font-family: 'Fira Code', 'Consolas', monospace;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }
  #hud {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px 12px;
    border-radius: 12px;
    background: rgba(10, 10, 18, 0.85);
    color: #06d6f0;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid rgba(6, 214, 240, 0.5);
    box-shadow: 0 0 10px rgba(6, 214, 240, 0.35);
    text-shadow: 0 0 6px rgba(6, 214, 240, 0.55);
    white-space: nowrap;
    opacity: 1;
  }
</style>
<!-- Boot guard (classic script, see src/boot_guard.js) — reports crashes and a
     dead script to %TEMP%\nanoclick_web.log instead of dying silently. -->
<script src="boot_guard.js" data-boot-flag="__nanoclick_hud_boot_ok__" data-boot-label="hud"></script>
</head>
<body>
  <div id="hud">0</div>
  <script src="hud.js"></script>
</body>
</html>
