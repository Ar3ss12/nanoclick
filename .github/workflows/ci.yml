name: CI

# Windows runners bill at 2x the minutes multiplier, so doc-only pushes
# never start a run: paths-ignore skips the trigger when EVERY changed
# file matches one of the globs. workflow_dispatch stays as the manual
# escape hatch for "CI please anyway".
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/assets/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/assets/**'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # The snubber dependency is a path dep (`../../../snubber` relative to
      # src-tauri). From $GITHUB_WORKSPACE/nanoclick/src-tauri that resolves
      # TWO levels above $GITHUB_WORKSPACE (measured: first CI run died with
      # "failed to read G:\snubber\Cargo.toml" — actions/checkout cannot
      # check out outside the workspace), so after the checkout the tree is
      # copied to the location the path dep actually resolves to.
      - name: Checkout nanoclick
        uses: actions/checkout@v4
        with:
          path: nanoclick

      - name: Checkout snubber (path dependency)
        uses: actions/checkout@v4
        with:
          repository: Ar3ss12/snubber
          # Full SHA required: actions/checkout treats a short ref as a
          # branch name and the git fetch dies (measured: first CI run).
          # This SHA is snubber 0.7.0 — the version must match Cargo.lock, or
          # every `--locked` step dies on a version mismatch before compiling.
          # It must ALSO carry every snubber API this tree calls: this is a
          # separate checkout from the local `../../../snubber` path dep, so a
          # stale SHA compiles green on the dev host and dies here at the
          # first cargo step with E0425/E0599 (pin c1eef0d lacked the
          # LeakWatch / growth_crosses / poll_rollback_node API). Bump it in
          # the same commit that starts using new crate API;
          # `test_ci_pins_the_snubber_revision_the_build_resolves` holds the
          # pin to the checkout the local build resolves.
          ref: 4cbc7b5e9e10c5fde3b8692d232781713313b04f
          path: snubber

      - name: Stage snubber where the path dependency resolves
        run: |
          rm -rf "$GITHUB_WORKSPACE/../snubber"
          cp -r "$GITHUB_WORKSPACE/snubber" "$GITHUB_WORKSPACE/../snubber"

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nanoclick/src-tauri

      # ── 0. JS gates (format + lint + type check) ────────────────────────
      - name: JS gates
        working-directory: nanoclick
        run: powershell -ExecutionPolicy Bypass -File scripts/check-js.ps1

      # ── 1. Lints — lib only, deny all warnings ──────────────────────────
      # Fast-fail beats deep-fail: clippy costs ~1m on a warm cache, while the
      # abort compile + test lanes below cost ~10m together. A lint error is
      # cheaper to discover before either of them has run.
      # Runs on the ci-test profile so it shares dependency artifacts with the
      # test lanes below; --release here would compile the whole dep graph a
      # second time under a profile nothing else uses.
      # Test targets are intentionally excluded: the local gate keeps include_str
      # tripwire strings byte-exact, and clippy --fix on tests risks rewriting
      # them. CI must never be weaker than the local gate.
      - name: Clippy (lib, -D warnings)
        working-directory: nanoclick/src-tauri
        run: cargo clippy --profile ci-test --locked -j 2 --lib -- -D warnings

      # ── 2. Abort-shaped compile gate ─────────────────────────────────────
      # Lib + both bins compiled with panic=abort on stable. Running TESTS
      # under panic=abort is impossible with today's tooling (measured
      # 2026-10-28: stable cargo silently forces unwind for test targets,
      # RUSTFLAGS=-Cpanic=abort makes rustc refuse without -Zpanic_abort_tests,
      # and even nightly -Zpanic_abort_tests leaves the harness surviving a
      # panicking test — see [profile.ci-abort] in Cargo.toml, and
      # rust-lang/rust#67650). The compile gate still proves the codebase
      # builds with no unwinding tables; test EXECUTION runs in the lanes
      # below on the shipped unwind profile, which is what the binary ships.
      - name: Compile with panic=abort (lib + bins)
        working-directory: nanoclick/src-tauri
        run: cargo build --profile ci-abort --locked -j 2

      # ── 3. Test lane, ci-test profile ───────────────────────────────────
      # `cargo test --release` links every test target with FatLTO over the
      # whole dependency graph — one whole-program pass per tests/*.rs
      # executable. The ci-test profile (root Cargo.toml) keeps opt-level,
      # panic=unwind and strip identical and only swaps code shape for
      # ThinLTO + 16 codegen units, which is a link-time knob no assertion
      # can observe. The shipped executable still comes from [profile.release].
      - name: Lib tests (ci-test, non-physical)
        working-directory: nanoclick/src-tauri
        run: cargo test --profile ci-test --locked -j 2 --lib -- --skip physical_

      - name: Lib tests (ci-test, physical)
        working-directory: nanoclick/src-tauri
        run: cargo test --profile ci-test --locked -j 2 --lib -- physical

      # ── 4. Integration suites ───────────────────────────────────────────
      # One cargo invocation for all three executables: dependency artifacts
      # are resolved once and the links can overlap under -j 2. Cargo still
      # builds a separate executable per file and runs them sequentially, so
      # the injection e2e never overlaps the daemon handshake.
      - name: Integration suites (assets + daemon + guardian e2e)
        working-directory: nanoclick/src-tauri
        run: cargo test --profile ci-test --locked -j 2 --test test_assets --test daemon_handshake --test input_guardian_e2e

      - name: Daemon handshake (ignored chaos lane)
        working-directory: nanoclick/src-tauri
        run: cargo test --profile ci-test --locked -j 2 --test daemon_handshake -- --ignored
