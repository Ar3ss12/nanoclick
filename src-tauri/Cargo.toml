[package]
name = "nanoclick"
version = "1.2.0"
description = "NanoClick - Fast Windows Desktop Automation"
edition = "2021"

[[bin]]
name = "nanoclick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-codegen = { version = "2", features = [] }

[dependencies]
# `common-controls-v6` is deliberately NOT enabled, although it is part of
# tauri's `default` set. It forwards to `muda/common-controls-v6`, whose only
# effect is a call to `comctl32.dll!TaskDialogIndirect` in muda's Windows
# "About" dialog (muda-0.19.3/src/platform_impl/windows/mod.rs:1348).
# `TaskDialogIndirect` exists ONLY in comctl32 v6, which is activated by an
# application manifest. The unittest binary built from `src/lib.rs` is not a
# bin target, so tauri-build's `cargo:rustc-link-arg-bins=...resource.lib`
# never reaches it: the loader binds comctl32 v5.82, finds no such export and
# kills the process with `0xC0000139 STATUS_ENTRYPOINT_NOT_FOUND` before the
# first test runs. Dropping the feature makes muda link the `MessageBoxW`
# (user32) variant instead — a dialog this app never shows. The shipped app
# still activates comctl32 v6 through the manifest embedded by build.rs.
#
# Verify with: cargo tree -e features -i muda --offline
# tauri 2.11.5 default = ["wry", "compression", "common-controls-v6",
#                         "dynamic-acl", "x11", "dbus"]
# Keep the list below in sync when bumping tauri.
tauri = { version = "2", default-features = false, features = [
    "wry",
    "compression",
    "dynamic-acl",
    "x11",
    "dbus",
] }

tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
directories = "5.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
raw-window-handle = "0.6.2"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }
